name: CI

# Runs on every branch so a local/<task> or cloud/<task> commit carries a passing check before it is
# merged onto main (docs/WORKFLOW.md §1). pull_request covers Dependabot and cloud PRs.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (build, tests, ktlint, KDoc, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit SHA (docs/security-and-privacy.md); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Doc link check
        run: python3 scripts/check_docs.py

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      # The ubuntu runner ships the Android SDK with licences accepted; AGP installs any missing platform.
      - name: Gate
        run: ./gradlew check :app:assembleDebug --console=plain

      # ROADMAP R6 / M2 T10: `check` never runs verifyRoborazziDebug itself (the Roborazzi Gradle
      # plugin does not hook it into `check`), and goldens only exist in the tracked
      # src/test/screenshots/ directories once the owner has committed a recorded baseline
      # (docs/ARCHITECTURE.md §6 "Goldens"). Until then verifyRoborazziDebug has nothing to compare
      # against and would fail every preview as "missing golden", so it is skipped rather than run
      # and ignored — a real regression must still fail the build once goldens exist.
      - name: Check for recorded screenshot goldens
        id: goldens
        run: |
          if git ls-files '**/src/test/screenshots/*.png' | head -1 | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify screenshot goldens
        if: steps.goldens.outputs.present == 'true'
        run: ./gradlew verifyRoborazziDebug --console=plain

      - name: Manifest permission allow-list self-test
        run: python3 scripts/check_manifest_permissions.py --self-test

      - name: Manifest permission allow-list
        run: python3 scripts/check_manifest_permissions.py

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload test, lint and Roborazzi diff reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            **/build/reports/roborazzi/**
            **/build/outputs/roborazzi/**
          retention-days: 7
